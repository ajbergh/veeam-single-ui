<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Open Backup UI</title>
  <style>
    :root { color-scheme: dark; font-family: 'Segoe UI', sans-serif; background: #090b0e; color: #f1f5f9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: 300px; }
    .brand { color: #34d399; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
    h1 { font-size: 26px; font-weight: 500; margin: 22px 0 10px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
    .progress { height: 3px; margin-top: 28px; overflow: hidden; background: #1e293b; border-radius: 3px; }
    .progress::after { content: ''; display: block; width: 40%; height: 100%; background: #34d399; animation: progress 1.4s ease-in-out infinite alternate; }
    @keyframes progress { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; opacity: .7; } }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="brand">Open Backup UI</div>
    <h1>Opening your console</h1>
    <p>Your workspace will be ready in a moment.</p>
    <div class="progress" aria-hidden="true"></div>
  </main>
</body>
</html>
